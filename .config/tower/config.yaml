state_dir: $HOME/.local/state/tower

app:
  retention: 48h

agent:
  working_dir: $HOME/.local/state/tower/pi/workspace
  run_command: >
    pi -e /Users/ricoberger/.config/tower/pi-progress.ts --session-dir
    ../sessions --session-id {{.SessionID}} -p -- {{.Prompt}}
  resume_command: >
    ghostty-new --placement=tab --title={{.Title}} --command 'pi --session-dir
    ../sessions --session {{shquote .SessionID}}'

providers:
  alerts:
    poll_interval: 1m
    reopen_window: 24h
    sources:
      - name: dev-de1
        grafana_instance: dev-de1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: stage-de1
        grafana_instance: stage-de1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: prod-core
        grafana_instance: prod-core
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: prod-au1
        grafana_instance: prod-au1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: prod-de1
        grafana_instance: prod-de1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: prod-us1
        grafana_instance: prod-us1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
      - name: prod-ae1
        grafana_instance: prod-ae1
        grafana_alertmanager: grafana
        filter:
          - team="product-core-infra"
          - severity!="info"
        receiver: "incidentio"
    prompt: |
      You are running unattended for the user's work harness "tower". Nobody is
      watching this session right now; the user will resume it later and
      continue from where you stop.

      Task: investigate the alert below using the `sre-analyze-alert` skill.

      Rules for this run:
      1. Follow the skill exactly as written. Do not skip phases.
      2. This run is strictly READ-ONLY. Do not change anything anywhere: no
         kubectl/helm/flux mutations, no silences, no git push, no GitHub or Jira
         writes, no Grafana writes, no file changes.
      3. Stop at the skill's FIRST point where it would ask the user anything — a
         confirmation before a write action or a question about missing/ambiguous
         input. Do not answer it yourself and do not continue past it.
         - The request to "restate the alert so the user can confirm" is NOT a
           stop point in this run: include the restatement in your report.
      4. Never guess missing inputs. If you cannot continue without an answer,
         stop and state the exact question.
      5. During the skill's evidence-correlation phase, follow the global
         "Repository Discovery" rules to find relevant application and
         infrastructure/GitOps repositories. Inspect matching code, manifests
         and local Git history for the affected environment. Discovery remains
         read-only: do not edit files, fetch, clone, create branches/worktrees
         or change checkouts.
         - Do not treat an absent repository name as a blocker before bounded
           discovery. If a required mapping remains unresolved, preserve the
           findings collected so far and report candidates, evidence and the
           exact missing information; do not invent repository-specific fixes.
      6. End with the full report in the skill's report format. In its Fix
         section, include verified repository identities, absolute checkout
         paths, relevant files and proposed changes supported by evidence for
         repository-backed fixes. Distinguish inspected local revisions and
         uncommitted changes from deployed revisions; state when the latter
         are unknown. Finish with the open question (if any) and the proposed
         next step.
      7. Read-only applies to this unattended run only. If, after resuming,
         the user asks for repository changes (e.g. the proposed fix), treat
         that request as requiring a worktree. Do not edit the primary
         checkout or switch its branch. For each repository needing edits,
         inspect status, branches, remotes and
         `git worktree list --porcelain`, then resolve and fetch the remote's
         default branch (do not assume main or the current HEAD) and create
         `git -C <checkout> worktree add -b <branch> <path> <base>` BEFORE
         the first edit. Place it under
         ~/.worktrees/<owner-or-organization>/<repository>/<branch>,
         replacing slashes in the branch name with hyphens; this location
         takes precedence over repository-local worktree conventions. Check
         branch/path availability and never overwrite a collision. State the
         repository, branch and absolute worktree path before editing, and
         leave the worktree available. Worktree setup does not authorize
         commits, pushes or external writes.

      The alert:

      {{.Details}}

  pullrequests:
    poll_interval: 5m
    max_age: 336h
    sources:
      - name: authored
        query: archived:false is:open author:@me
      - name: review-requested
        query:
          archived:false is:open review-requested:@me -author:app/dependabot
    prompt: |
      You are running unattended for the user's work harness "tower". Nobody is
      watching this session right now; the user will resume it later and
      continue from where you stop.

      {{if eq .Source "review-requested" -}}
      Task: prepare a draft review of the pull request {{.URL}} using the
      `github-pr-review` skill.
      {{- else if eq .Source "authored" -}}
      Task: prepare proposed fixes for the review feedback on the pull request
      {{.URL}} using the `github-pr-review-reviews` skill. If it finds no
      unresolved, non-outdated feedback to process, prepare a draft self-review
      of the same pull request with the `github-pr-review` skill instead (see
      rule 9).
      {{- else -}}
      Stop: unsupported pull request source "{{.Source}}". Report the source
      and ask which workflow to use. Do not select a skill, prepare a workspace
      or take any action on the pull request.
      {{- end}}

      {{if or (eq .Source "review-requested") (eq .Source "authored") -}}
      Rules for this run:
      1. Follow the selected skill in order; do not skip steps or confirmations.
         Stop at its FIRST required question, including merged/closed PRs,
         branch conflicts, the overview and per-item approvals. Do not answer
         for the user or continue past it. Present everything prepared so far
         and the exact question to answer when resuming.
      2. This run is DRAFT-ONLY. Keep review comments and proposed diffs in the
         report; do not apply suggestions or modify project source files.
         Never create pending reviews, post reviews/comments/replies, resolve
         threads, commit, push, merge, update the PR or mutate external systems.
         Only the Git/worktree preparation below is preauthorized.
      3. Derive the GitHub host, base owner/repository and PR number from the
         supplied PR URL. Refresh the state, base/head refs, head repository
         and owner, and headRefOid before analysis; the polled details are only
         a snapshot. The base repository owns the PR and its API identifiers,
         even when the head is in a fork. Use the full URL or an explicit repo
         for `gh pr`, and explicit base-repository paths and host for `gh api`.
         Anchor the reviewed diff and code to the recorded head SHA.
      4. Follow the global "Repository Discovery" rules whenever local context
         is needed. Read applicable repository instructions before analysis
         and use explicit paths or `git -C`, never the incidental launch
         directory. API-only reviews need no worktree. Do not clone automatically.
      5. When a local checkout is required, prepare it only after resolving an
         OPEN PR. Inspect status, branches, remotes and
         `git worktree list --porcelain`. You may fetch only required PR refs
         from verified remotes and create an isolated branch/worktree without
         routine confirmation.
         For review-requested PRs, use a detached worktree at the verified head
         SHA. For authored feedback, first locate and prefer the existing
         checkout/worktree on the actual PR head branch. Verify its
         head-repository/remote identity, status and relationship to the remote
         head before preparing another workspace. If it has uncommitted changes
         or unpushed commits, or is stale/diverged from the PR head, report that
         state and stop for confirmation. Do not create a fresh worktree to
         bypass existing local work. Select or prepare the workspace BEFORE the
         skill's branch-state check. In both cases, HEAD must equal headRefOid;
         a branch name, current checkout or default-branch base is not sufficient.
      6. Place new worktrees under
         ~/.worktrees/<base-owner>/<base-repository>/<branch-or-pr-ref>, replacing
         slashes in the last component with hyphens. For detached reviews, use
         a name such as pr-<number>-<short-head-sha>. Check branch and path
         availability; never overwrite a collision. Reuse only a worktree
         verified to belong to this PR task, clean, at the recorded head SHA
         and not in use by another task. Never switch an existing checkout,
         stash, reset or force anything. If safe setup is blocked, stop and
         report why. Leave created worktrees available for the resumed session.
      7. Do not execute PR-provided build, test or install scripts without
         explicit execution approval or an already approved isolated environment.
         A worktree is not isolation. Read CI results without triggering reruns.
         If required execution cannot meet these limits, stop and report the
         verification gap and approval needed; do not silently skip the step.
      8. Before finalizing the draft, recheck the PR state and head SHA. If they
         changed, report the drift and do not present stale findings as current.
         End with each used skill's summary or draft, PR URL, repositories,
         reviewed head SHA, branch/detached state, absolute checkout/worktree
         paths, checks run or skipped with reasons, and the open question or
         next step. On resume, revalidate the PR state, head, feedback threads
         and diff anchors before applying or posting anything. Refresh
         affected drafts and seek renewed approval if they changed; never apply
         stale diffs or reset a worktree automatically.
      9. Self-review fallback (authored PRs only): switch to
         `github-pr-review` only after the feedback skill's collect and filter
         steps found no unresolved, non-outdated feedback. List any outdated
         items it set aside. If any feedback is in scope, including
         needs-discussion items, do not self-review. Stop at the feedback
         skill's first question instead.
         For the self-review, reuse the workspace and head SHA verified under
         rule 5; do not create a detached worktree. It is the user's own PR,
         so plan for the `COMMENT` event and mark severity in comment bodies
         ("blocking:", "nit:"). Stop at the skill's overview question with
         the full draft (comments and overall message ending with the
         reviewed SHA). Rules 2, 7 and 8 still apply: nothing is posted, and
         PR scripts are not run.
      {{end}}

      The pull request:

      {{.Details}}

  jira:
    poll_interval: 5m
    sources:
      - name: assigned
        jql:
          assignee = currentUser() AND statusCategory != Done AND status !=
          Backlog ORDER BY updated DESC
    prompt: |
      You are running unattended for the user's work harness "tower". Nobody is
      watching this session right now; the user will resume it later and
      continue from where you stop.

      Task: work on the Jira ticket {{.Title}}{{with .URL}} ({{.}}){{end}}. The details below are
      only a polled snapshot without comments, subtasks or linked work items.

      Rules for this run:
      1. Refresh the ticket before planning: read it with
         `acli jira workitem view <KEY> --fields '*all' --json`, including its
         comments, subtasks, parent and linked work items. If the ticket is
         done or no longer assigned to the user, report that and stop.
      2. Jira is READ-ONLY in this run: no transitions, comments, assignments,
         worklogs, field edits or new work items. Draft any comment or update
         you would make in the report instead.
      3. Do not push, merge, deploy or write to other external systems (GitHub,
         Grafana, Kubernetes) without the user's confirmation: stop before such
         a step, summarize what you did and what you would do next, and ask.
         For alert or incident tickets, investigate read-only with the
         `sre-analyze-alert` skill.
      4. If a question, missing requirement or required confirmation blocks
         progress, stop and report the exact question for the user to answer
         when resuming. Do not guess acceptance criteria, answer for the user
         or continue past a skill's required confirmation. Do not commit
         unless the ticket explicitly calls for code changes; before
         committing, read and follow the `git-commit` skill.

      Workspace rules:
      1. Follow the global "Repository Discovery" rules to identify and verify
         all repositories relevant to the ticket, not just the launch
         directory. Multiple repositories may be relevant; verify which need
         edits. If a required repository is still ambiguous or unavailable
         after bounded discovery, stop and report candidates, evidence and the
         exact question needed to continue.
      2. Read-only work needs no implementation-base resolution, fetches or new
         branches/worktrees. Work unrelated to repositories needs no
         repository discovery or worktree creation.
      3. Only when the ticket calls for repository changes, inspect each
         target's status, branches, remotes and `git worktree list --porcelain`.
         Use a dedicated branch and worktree for each repository needing edits,
         without asking for routine permission. Use the ticket's requested
         base; otherwise resolve and fetch the appropriate remote's default
         branch. Do not assume main, master or the current HEAD. If the
         required base cannot be resolved or fetched, stop and report the
         blocker rather than silently using a stale or different base.
      4. Use a branch such as tower/<ticket-key-lowercase>-<short-slug>,
         following repository naming conventions. Place its worktree under
         ~/.worktrees/<owner-or-organization>/<repository>/<branch>,
         replacing slashes in the branch name with hyphens. Derive the owner
         and repository from the primary checkout or verified remote.
         Check branch and path availability; choose another name on an
         unrelated collision rather than overwriting or deleting anything.
         Create it with
         `git -C <checkout> worktree add -b <branch> <path> <base>`.
      5. Reuse an existing worktree only when it is verified to belong to this
         same ticket and continuing it is safe. If explicitly continuing an
         existing branch with no worktree, use
         `git -C <checkout> worktree add <path> <branch>`.
         Never force a branch to be checked out in multiple worktrees.
         Preserve existing work; never automatically stash, reset, or move
         uncommitted changes. If the ticket depends on changes outside its
         worktree, stop and ask how to proceed.
      6. Before editing each repository, state its identity, branch and absolute
         worktree path. Perform all edits and checks in the corresponding
         worktree using explicit paths or working directories. Read applicable
         instructions there, including those for changed subdirectories.
      7. Leave branches and worktrees available; do not remove them on
         completion. End with the ticket key and URL, what you did, each
         repository, branch, absolute checkout or worktree path, verification
         results, drafted Jira comments/updates, and any blocker or next step.
         Workspace setup does not authorize commits, pushes or writes to
         external systems.

      The Jira ticket:

      {{.Details}}

